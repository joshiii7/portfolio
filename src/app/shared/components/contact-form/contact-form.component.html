<form #formEl [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div [class.form-row]="!compact()">
    <div class="form-group">
      <label class="form-label" for="contactName">Name<span class="form-required" aria-hidden="true">*</span></label>
      <input
        class="form-input"
        type="text"
        id="contactName"
        formControlName="name"
        placeholder="Juan Dela Cruz"
        maxlength="100"
        [class.is-invalid]="isInvalid('name')"
        [class.is-valid]="isValid('name')"
        [attr.aria-invalid]="isInvalid('name')"
        aria-describedby="contactNameError"
      />
      <p class="form-error" [class.is-visible]="isInvalid('name')" id="contactNameError" role="alert">{{ error('name') }}</p>
    </div>

    <div class="form-group">
      <label class="form-label" for="contactEmail">Email<span class="form-required" aria-hidden="true">*</span></label>
      <input
        class="form-input"
        type="email"
        id="contactEmail"
        formControlName="email"
        placeholder="juan@email.com"
        [class.is-invalid]="isInvalid('email')"
        [class.is-valid]="isValid('email')"
        [attr.aria-invalid]="isInvalid('email')"
        aria-describedby="contactEmailError"
      />
      <p class="form-error" [class.is-visible]="isInvalid('email')" id="contactEmailError" role="alert">{{ error('email') }}</p>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label" for="contactSubject">Subject<span class="form-required" aria-hidden="true">*</span></label>
    <input
      class="form-input"
      type="text"
      id="contactSubject"
      formControlName="subject"
      placeholder="What is your project about?"
      maxlength="150"
      [class.is-invalid]="isInvalid('subject')"
      [class.is-valid]="isValid('subject')"
      [attr.aria-invalid]="isInvalid('subject')"
      aria-describedby="contactSubjectError"
    />
    <p class="form-error" [class.is-visible]="isInvalid('subject')" id="contactSubjectError" role="alert">{{ error('subject') }}</p>
  </div>

  <div class="form-group">
    <label class="form-label" for="contactMessage">Message<span class="form-required" aria-hidden="true">*</span></label>
    <textarea
      class="form-textarea"
      id="contactMessage"
      formControlName="message"
      placeholder="Tell me briefly about your project."
      maxlength="2000"
      [class.is-invalid]="isInvalid('message')"
      [class.is-valid]="isValid('message')"
      [attr.aria-invalid]="isInvalid('message')"
      aria-describedby="contactMessageError"
    ></textarea>
    <p class="form-error" [class.is-visible]="isInvalid('message')" id="contactMessageError" role="alert">{{ error('message') }}</p>
  </div>

  <div class="form-hp" aria-hidden="true">
    <label for="contactWebsite">Leave this field empty</label>
    <input type="text" id="contactWebsite" formControlName="spam" tabindex="-1" autocomplete="off" />
  </div>

  <div class="form-group form-recaptcha">
    <div #recaptchaEl></div>
    <p class="form-error" [class.is-visible]="recaptchaTouched() && !recaptchaToken()" role="alert">Please complete the reCAPTCHA check.</p>
  </div>

  <button type="submit" class="btn btn-primary btn-lg btn-block" [disabled]="sending()">{{ sending() ? 'Sending…' : 'Send Message' }}</button>
  <p
    class="form-status"
    [class.is-visible]="statusMessage()"
    [class.is-error]="statusMessage() && statusKind() === 'error'"
    [class.is-success]="statusMessage() && statusKind() === 'success'"
    id="formStatus"
    role="status"
    aria-live="polite"
  >{{ statusMessage() }}</p>
  <p class="form-privacy">Your information is secure and never shared.</p>
</form>
