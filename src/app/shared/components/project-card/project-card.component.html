<a class="project-card-link" [routerLink]="['/projects', project().slug]">
  <app-project-picture [image]="cardImage()" [sizes]="teaserSizes" [crop]="true" />
  <h3>{{ project().name }}</h3>
  <p>{{ project().summary }}</p>
  <div class="project-tags">
    @for (tool of project().tools; track tool) {
      <span class="tag">{{ tool }}</span>
    }
  </div>
</a>
