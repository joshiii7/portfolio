<footer class="site-footer">
  <div class="footer-content">
    <div>
      <a routerLink="/" class="logo">{{ site.handle }}</a>
      <p>{{ site.tagline }}</p>
      <app-social-links />
    </div>
    <nav aria-label="Footer">
      <h3>Site</h3>
      <ul>
        @for (link of links; track link.path) {
          <li><a [routerLink]="link.path">{{ link.label }}</a></li>
        }
      </ul>
    </nav>
    <div>
      <h3>Get in Touch</h3>
      <ul>
        <li><a [href]="'mailto:' + site.email"><app-icon name="mail" [inline]="true" />{{ site.email }}</a></li>
        <li><a [href]="site.phoneHref"><app-icon name="phone" [inline]="true" />{{ site.phone }}</a></li>
      </ul>
    </div>
  </div>
  <div class="footer-bottom">
    <p>&copy; {{ year }} {{ site.legalName }}. All rights reserved.</p>
    <nav class="footer-legal" aria-label="Legal">
      <a routerLink="/accessibility">Accessibility</a>
      <a routerLink="/privacy">Privacy Policy</a>
    </nav>
  </div>
</footer>
