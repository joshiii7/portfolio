<app-page-banner
  title="Let's Work Together"
  text="Have a project in mind, like a web, mobile, or desktop application, or something in between? Tell me about it and I'll get back to you."
  [photo]="photos.handsTyping" focal="center"
/>

<section appReveal class="section-py">
  <div class="container">
    <div class="contact-grid">
      <app-contact-form />

      <div class="card contact-info-card">
        <h3>Prefer Email Directly?</h3>
        <p>If the form doesn't work for you, or you'd rather write in your own email client, reach out directly:</p>
        <ul>
          <li><a [href]="'mailto:' + site.email"><app-icon name="mail" [inline]="true" />{{ site.email }}</a></li>
          <li><a [href]="site.phoneHref"><app-icon name="phone" [inline]="true" />{{ site.phone }}</a></li>
        </ul>
        <app-social-links />
        <p class="mt-3 mb-0">I read every message personally and try to reply as soon as I can.</p>
      </div>
    </div>
  </div>
</section>

<app-faq-section
  idPrefix="contactFaq"
  intro="A few things people usually ask before reaching out."
  [faqs]="faqs"
  [secondary]="true"
/>
