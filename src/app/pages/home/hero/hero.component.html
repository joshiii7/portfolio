<section class="hero">
  <canvas #canvas aria-hidden="true"></canvas>
  <div class="hero-inner container">
    <div class="hero-grid">
      <div class="hero-copy">
        <h1>I Build Software That Solves Real Problems</h1>
        <p>Full-stack development for businesses, institutions, and startups, spanning web applications, mobile apps, and desktop software.</p>
        <div class="hero-actions">
          <a routerLink="/projects" class="btn btn-primary">View My Work</a>
          <a [href]="site.phoneHref" class="btn btn-outline btn-phone"><app-icon name="phone" /> {{ site.phone }}</a>
        </div>
      </div>

      <div class="card hero-form-card">
        <h2>Start a Project</h2>
        <app-contact-form [compact]="true" />
      </div>
    </div>
  </div>
</section>
